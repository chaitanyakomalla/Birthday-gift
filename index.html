<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday menaazuuu🥰🥰 🎂</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      overflow: hidden;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4, #a18cd1);
    }

    .container {
      width: 90%;
      max-width: 600px;
      padding: 35px 20px;
      border-radius: 25px;
      background: rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      animation: appear 1.5s ease;
      z-index: 2;
    }

    .cake {
      font-size: 80px;
      animation: bounce 1.5s infinite;
      margin-bottom: 15px;
    }

    h1 {
      font-size: clamp(38px, 10vw, 70px);
      color: white;
      text-shadow: 0 0 15px #ff4f81;
      margin-bottom: 15px;
      animation: glow 2s infinite alternate;
    }

    h2 {
      font-size: clamp(24px, 6vw, 40px);
      color: #fff;
      margin-bottom: 20px;
    }

    p {
      font-size: clamp(17px, 4vw, 22px);
      line-height: 1.6;
      color: white;
      margin-bottom: 25px;
    }

    button {
      border: none;
      padding: 14px 28px;
      border-radius: 30px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      color: #ff4f81;
      background: white;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
      transition: 0.3s;
    }

    button:hover {
      transform: scale(1.08);
      background: #fff0f5;
    }

    .heart {
      position: fixed;
      bottom: -30px;
      font-size: 25px;
      animation: floatUp 5s linear forwards;
      pointer-events: none;
    }

    .confetti {
      position: fixed;
      width: 10px;
      height: 10px;
      top: -20px;
      pointer-events: none;
      animation: fall linear forwards;
      z-index: 5;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: scale(0.7);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes bounce {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-15px);
      }
    }

    @keyframes glow {
      from {
        text-shadow: 0 0 10px #fff;
      }
      to {
        text-shadow: 0 0 30px #ff4f81, 0 0 50px #fff;
      }
    }

    @keyframes fall {
      to {
        transform: translateY(110vh) rotate(720deg);
        opacity: 0;
      }
    }

    @keyframes floatUp {
      to {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
      }
    }

    @media (max-width: 480px) {
      .container {
        padding: 30px 18px;
      }

      .cake {
        font-size: 65px;
      }

      button {
        width: 80%;
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="cake">🎂</div>

    <h1>Happy Birthday!</h1>

    <h2>🎉 Dear menaazuuu🥰🥰 🎉</h2>

    <p>
      Wishing you a very Happy Birthday! 🥳
      May your day be filled with happiness, laughter,
      beautiful memories and lots of love. ❤️
    </p>

    <button onclick="celebrate()">
      🎊 Celebrate Again 🎊
    </button>
  </div>

  <script>
    function createConfetti() {
      const confetti = document.createElement("div");
      confetti.classList.add("confetti");

      const colors = [
        "#ff4f81",
        "#ffd700",
        "#00c2ff",
        "#7cff6b",
        "#ffffff",
        "#ff7b00"
      ];

      confetti.style.left = Math.random() * 100 + "vw";
      confetti.style.background =
        colors[Math.floor(Math.random() * colors.length)];

      confetti.style.width = Math.random() * 8 + 6 + "px";
      confetti.style.height = Math.random() * 8 + 6 + "px";

      confetti.style.animationDuration =
        Math.random() * 3 + 2 + "s";

      document.body.appendChild(confetti);

      setTimeout(() => {
        confetti.remove();
      }, 5000);
    }

    function createHeart() {
      const heart = document.createElement("div");
      heart.classList.add("heart");
      heart.innerHTML = "❤️";

      heart.style.left = Math.random() * 100 + "vw";

      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 6000);
    }

    function celebrate() {
      for (let i = 0; i < 120; i++) {
        setTimeout(createConfetti, i * 15);
      }

      for (let i = 0; i < 15; i++) {
        setTimeout(createHeart, i * 150);
      }
    }

    window.onload = celebrate;
  </script>

</body>
</html>
